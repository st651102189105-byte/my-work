<script>
/* ================= DATA ================= */

let tasks = JSON.parse(localStorage.getItem("myTasks") || "[]");
let currentFilter = "all";
let firebaseReady = false;
let currentUser = null;
let isSaving = false;

const thaiMonths = [
    "มกราคม",
    "กุมภาพันธ์",
    "มีนาคม",
    "เมษายน",
    "พฤษภาคม",
    "มิถุนายน",
    "กรกฎาคม",
    "สิงหาคม",
    "กันยายน",
    "ตุลาคม",
    "พฤศจิกายน",
    "ธันวาคม"
];

/* ================= FIREBASE USER DATA =================
   ข้อมูลของแต่ละคนจะอยู่ที่:
   tasks/{Firebase Anonymous UID}

   ทำให้ผู้ใช้แต่ละคนไม่ใช้เอกสารเดียวกัน
========================================================= */

function getUserTaskRef() {
    if (!currentUser) {
        throw new Error("ยังไม่ได้เข้าสู่ระบบ Firebase");
    }

    return db.collection("tasks").doc(currentUser.uid);
}

/* ================= LOCAL STORAGE ================= */

function saveLocalData() {
    localStorage.setItem("myTasks", JSON.stringify(tasks));
}

/* ================= CONNECTION STATUS ================= */

function createConnectionStatus() {
    if (document.getElementById("connectionStatus")) return;

    const el = document.createElement("div");
    el.id = "connectionStatus";

    Object.assign(el.style, {
        position: "fixed",
        right: "15px",
        bottom: "15px",
        zIndex: "9999",
        background: "#ffffff",
        color: "#77758a",
        padding: "9px 14px",
        borderRadius: "10px",
        boxShadow: "0 4px 15px rgba(0,0,0,.08)",
        fontSize: "12px",
        transition: "all .2s"
    });

    el.textContent = "กำลังเชื่อมต่อ Firebase...";
    document.body.appendChild(el);
}

function setConnectionStatus(message, type = "normal") {
    const el = document.getElementById("connectionStatus");
    if (!el) return;

    el.textContent = message;

    if (type === "success") {
        el.style.color = "#159351";
    } else if (type === "error") {
        el.style.color = "#d44b4b";
    } else {
        el.style.color = "#77758a";
    }
}

/* ================= YEAR ================= */

const currentYear = new Date().getFullYear();

const yearSelect =
    document.getElementById("yearSelect");

const summaryYearSelect =
    document.getElementById("summaryYearSelect");

const monthSelect =
    document.getElementById("monthSelect");

for (
    let year = currentYear - 5;
    year <= currentYear + 10;
    year++
) {
    const option = document.createElement("option");
    option.value = year;
    option.textContent = year;
    yearSelect.appendChild(option);

    const option2 = document.createElement("option");
    option2.value = year;
    option2.textContent = year;
    summaryYearSelect.appendChild(option2);
}

yearSelect.value = currentYear;
summaryYearSelect.value = currentYear;

/* ================= MONTH ================= */

monthSelect.value = new Date().getMonth();

/* ================= TODAY ================= */

function showToday() {
    const now = new Date();

    const day =
        String(now.getDate()).padStart(2, "0");

    const month =
        String(now.getMonth() + 1).padStart(2, "0");

    const year =
        now.getFullYear();

    const days = [
        "วันอาทิตย์",
        "วันจันทร์",
        "วันอังคาร",
        "วันพุธ",
        "วันพฤหัสบดี",
        "วันศุกร์",
        "วันเสาร์"
    ];

    document.getElementById("todayDate").textContent =
        `${day}/${month}/${year}`;

    document.getElementById("todayDay").textContent =
        days[now.getDay()];
}

/* ================= MODAL ================= */

function openModal() {
    document.getElementById("taskModal").style.display = "flex";

    setTimeout(() => {
        document.getElementById("taskName").focus();
    }, 50);
}

function closeModal() {
    document.getElementById("taskModal").style.display = "none";
}

/* ================= DATE VALIDATION ================= */

function isValidDeadline(value) {
    const pattern =
        /^(\d{2})\/(\d{2})\/(\d{4}) (\d{2}):(\d{2})$/;

    const match = value.match(pattern);

    if (!match) return false;

    const day = Number(match[1]);
    const month = Number(match[2]);
    const year = Number(match[3]);
    const hour = Number(match[4]);
    const minute = Number(match[5]);

    if (month < 1 || month > 12) return false;
    if (day < 1 || day > 31) return false;
    if (hour < 0 || hour > 23) return false;
    if (minute < 0 || minute > 59) return false;

    const date =
        new Date(
            year,
            month - 1,
            day,
            hour,
            minute
        );

    return (
        date.getFullYear() === year &&
        date.getMonth() === month - 1 &&
        date.getDate() === day &&
        date.getHours() === hour &&
        date.getMinutes() === minute
    );
}

/* ================= PARSE DATE ================= */

function parseThaiDate(value) {
    if (!value) return null;

    const pattern =
        /^(\d{2})\/(\d{2})\/(\d{4})(?: (\d{2}):(\d{2}))?$/;

    const match = value.match(pattern);

    if (!match) return null;

    const date = new Date(
        Number(match[3]),
        Number(match[2]) - 1,
        Number(match[1]),
        Number(match[4] || 0),
        Number(match[5] || 0)
    );

    if (Number.isNaN(date.getTime())) return null;

    return date;
}

function getTaskDate(task) {
    if (task.deadline) {
        const deadlineDate = parseThaiDate(task.deadline);

        if (deadlineDate) {
            return deadlineDate;
        }
    }

    if (task.createdAt) {
        const createdDate = new Date(task.createdAt);

        if (!Number.isNaN(createdDate.getTime())) {
            return createdDate;
        }
    }

    return null;
}

/* ================= FIREBASE LOAD ================= */

async function loadData() {
    try {
        setConnectionStatus(
            "กำลังเข้าสู่ระบบ Firebase..."
        );

        /*
         Anonymous Authentication ต้องเปิด:
         Firebase Console
         → Authentication
         → Sign-in method
         → Anonymous
         → Enable
        */
        if (!auth.currentUser) {
            await auth.signInAnonymously();
        }

        currentUser = auth.currentUser;

        if (!currentUser) {
            throw new Error(
                "ไม่พบผู้ใช้ Firebase"
            );
        }

        const ref = getUserTaskRef();
        const doc = await ref.get();

        if (doc.exists) {
            const data = doc.data();

            if (Array.isArray(data.tasks)) {
                tasks = data.tasks;
                saveLocalData();
            } else {
                tasks = [];
                saveLocalData();
            }
        } else {
            /*
             ถ้ายังไม่มีข้อมูลของผู้ใช้นี้
             ให้เอาข้อมูล localStorage ขึ้น Firebase ครั้งแรก
            */
            await ref.set({
                tasks: tasks,
                updatedAt:
                    firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        firebaseReady = true;

        setConnectionStatus(
            "✓ เชื่อมต่อ Firebase แล้ว",
            "success"
        );

        renderTasks();
        renderMonthSummary();
        updateSummary();

        console.log(
            "โหลดข้อมูลจาก Firebase สำเร็จ"
        );

    } catch (error) {
        firebaseReady = false;

        console.error(
            "โหลด Firebase ไม่สำเร็จ:",
            error
        );

        setConnectionStatus(
            "⚠ Firebase ยังไม่พร้อม",
            "error"
        );

        /*
         ถ้า Firebase มีปัญหา
         แอปยังเปิดและใช้ข้อมูล localStorage ได้
        */
        renderTasks();
        renderMonthSummary();
        updateSummary();

        alert(
            "เชื่อมต่อ Firebase ไม่สำเร็จ\n\n" +
            error.message +
            "\n\n" +
            "แอปจะยังใช้ข้อมูลในเครื่องชั่วคราว"
        );
    }
}

/* ================= FIREBASE SAVE ================= */

async function saveData() {
    saveLocalData();

    if (!firebaseReady || !currentUser) {
        return true;
    }

    if (isSaving) {
        return false;
    }

    isSaving = true;

    try {
        await getUserTaskRef().set({
            tasks: tasks,
            updatedAt:
                firebase.firestore.FieldValue.serverTimestamp()
        });

        setConnectionStatus(
            "✓ บันทึก Firebase แล้ว",
            "success"
        );

        console.log(
            "บันทึกข้อมูลลง Firebase สำเร็จ"
        );

        return true;

    } catch (error) {
        console.error(
            "บันทึก Firebase ไม่สำเร็จ:",
            error
        );

        setConnectionStatus(
            "⚠ บันทึก Firebase ไม่สำเร็จ",
            "error"
        );

        alert(
            "บันทึกข้อมูลลง Firebase ไม่สำเร็จ\n\n" +
            error.message
        );

        return false;

    } finally {
        isSaving = false;
    }
}

/* ================= ADD TASK ================= */

async function saveTask() {
    const name =
        document.getElementById("taskName")
            .value.trim();

    const detail =
        document.getElementById("taskDetail")
            .value.trim();

    const deadline =
        document.getElementById("taskDeadline")
            .value.trim();

    if (name === "") {
        alert("กรุณาใส่ชื่องาน");
        return;
    }

    if (
        deadline !== "" &&
        !isValidDeadline(deadline)
    ) {
        alert(
            "รูปแบบวันที่ไม่ถูกต้อง\n\n" +
            "กรุณาใช้รูปแบบ\n" +
            "05/09/2026 17:00"
        );
        return;
    }

    const task = {
        id: Date.now(),
        name: name,
        detail: detail,
        deadline: deadline,
        status: "pending",
        createdAt: new Date().toISOString()
    };

    tasks.push(task);

    const button =
        document.querySelector(
            '#taskModal .save-btn'
        );

    if (button) {
        button.disabled = true;
        button.textContent = "กำลังบันทึก...";
    }

    const ok = await saveData();

    if (!ok && firebaseReady) {
        tasks = tasks.filter(
            item => item.id !== task.id
        );

        saveLocalData();

        if (button) {
            button.disabled = false;
            button.textContent = "บันทึกงาน";
        }

        renderTasks();
        renderMonthSummary();
        updateSummary();

        return;
    }

    document.getElementById("taskName").value = "";
    document.getElementById("taskDetail").value = "";
    document.getElementById("taskDeadline").value = "";

    if (button) {
        button.disabled = false;
        button.textContent = "บันทึกงาน";
    }

    closeModal();

    renderTasks();
    renderMonthSummary();
    updateSummary();
}

/* ================= RENDER TASKS ================= */

function renderTasks() {
    const selectedYear =
        Number(yearSelect.value);

    const selectedMonth =
        Number(monthSelect.value);

    let filteredTasks =
        tasks.filter(task => {
            const date = getTaskDate(task);

            if (!date) return false;

            return (
                date.getFullYear() === selectedYear &&
                date.getMonth() === selectedMonth
            );
        });

    if (currentFilter !== "all") {
        filteredTasks =
            filteredTasks.filter(
                task =>
                    task.status === currentFilter
            );
    }

    const taskList =
        document.getElementById("taskList");

    const emptyState =
        document.getElementById("emptyState");

    taskList.innerHTML = "";

    if (filteredTasks.length === 0) {
        taskList.style.display = "none";
        emptyState.style.display = "flex";
    } else {
        taskList.style.display = "block";
        emptyState.style.display = "none";

        filteredTasks.sort((a, b) => {
            const dateA = getTaskDate(a);
            const dateB = getTaskDate(b);

            return (
                (dateA ? dateA.getTime() : 0) -
                (dateB ? dateB.getTime() : 0)
            );
        });

        filteredTasks.forEach(task => {
            const card =
                document.createElement("div");

            card.className = "task-card";

            const icon =
                task.status === "done"
                    ? "✅"
                    : "🟡";

            const statusText =
                task.status === "done"
                    ? "✓ เสร็จแล้ว"
                    : "◷ ยังไม่เสร็จ";

            const statusClass =
                task.status === "done"
                    ? "status-done"
                    : "status-pending";

            card.innerHTML = `
                <div class="task-top">

                    <div>

                        <div class="task-name">
                            ${icon}
                            ${escapeHtml(task.name)}
                        </div>

                        <div class="task-detail">
                            ${
                                task.detail
                                    ? escapeHtml(task.detail)
                                    : "ไม่มีรายละเอียด"
                            }
                        </div>

                        <div class="task-deadline">
                            📅 กำหนดส่ง:
                            ${
                                task.deadline ||
                                "ไม่ได้กำหนด"
                            }
                        </div>

                    </div>

                    <button
                        class="status-btn ${statusClass}"
                        onclick="toggleStatus(${Number(task.id)})"
                    >
                        ${statusText}
                    </button>

                </div>

                <div class="task-actions">

                    <button
                        class="delete-btn"
                        onclick="deleteTask(${Number(task.id)})"
                    >
                        🗑 ลบงาน
                    </button>

                </div>
            `;

            taskList.appendChild(card);
        });
    }

    updateSummary();
}

/* ================= SUMMARY ================= */

function updateSummary() {
    const selectedYear =
        Number(yearSelect.value);

    const yearTasks =
        tasks.filter(task => {
            const date = getTaskDate(task);

            return (
                date &&
                date.getFullYear() === selectedYear
            );
        });

    const done =
        yearTasks.filter(
            task => task.status === "done"
        ).length;

    const pending =
        yearTasks.filter(
            task => task.status === "pending"
        ).length;

    document.getElementById("totalCount")
        .textContent = tasks.length;

    document.getElementById("doneCount")
        .textContent = done;

    document.getElementById("pendingCount")
        .textContent = pending;

    document.getElementById("selectedYearCount")
        .textContent = yearTasks.length;
}

/* ================= MONTH SUMMARY ================= */

function renderMonthSummary() {
    const year =
        Number(summaryYearSelect.value);

    const grid =
        document.getElementById("monthGrid");

    grid.innerHTML = "";

    const selectedMainYear =
        Number(yearSelect.value);

    const selectedMainMonth =
        Number(monthSelect.value);

    for (
        let month = 0;
        month < 12;
        month++
    ) {
        const monthTasks =
            tasks.filter(task => {
                const date = getTaskDate(task);

                if (!date) return false;

                return (
                    date.getFullYear() === year &&
                    date.getMonth() === month
                );
            });

        const done =
            monthTasks.filter(
                task => task.status === "done"
            ).length;

        const pending =
            monthTasks.filter(
                task => task.status === "pending"
            ).length;

        const card =
            document.createElement("div");

        card.className = "month-card";

        if (
            year === selectedMainYear &&
            month === selectedMainMonth
        ) {
            card.classList.add("current");
        }

        card.innerHTML = `
            <div class="month-name">
                ${thaiMonths[month]}
            </div>

            <div class="month-number">
                ${monthTasks.length}
            </div>

            <div class="month-label">
                งานทั้งหมด
            </div>

            <div class="month-status">

                <span class="month-done">
                    ✓ ${done} เสร็จ
                </span>

                <span class="month-pending">
                    ◷ ${pending} ยัง
                </span>

            </div>
        `;

        card.addEventListener(
            "click",
            function() {
                yearSelect.value = year;
                monthSelect.value = month;

                currentFilter = "all";

                document
                    .querySelectorAll(".filter")
                    .forEach(
                        btn =>
                            btn.classList.remove(
                                "active"
                            )
                    );

                const allButton =
                    document.querySelector(
                        '[data-filter="all"]'
                    );

                if (allButton) {
                    allButton.classList.add("active");
                }

                renderTasks();
                renderMonthSummary();

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            }
        );

        grid.appendChild(card);
    }
}

/* ================= STATUS ================= */

async function toggleStatus(id) {
    const task =
        tasks.find(
            item => Number(item.id) === Number(id)
        );

    if (!task) return;

    const oldStatus = task.status;

    task.status =
        task.status === "done"
            ? "pending"
            : "done";

    renderTasks();
    renderMonthSummary();

    const ok = await saveData();

    if (!ok && firebaseReady) {
        task.status = oldStatus;

        saveLocalData();

        renderTasks();
        renderMonthSummary();
        updateSummary();
    }
}

/* ================= DELETE ================= */

async function deleteTask(id) {
    if (
        !confirm(
            "ต้องการลบงานนี้หรือไม่?"
        )
    ) {
        return;
    }

    const oldTasks = [...tasks];

    tasks =
        tasks.filter(
            task =>
                Number(task.id) !== Number(id)
        );

    renderTasks();
    renderMonthSummary();

    const ok = await saveData();

    if (!ok && firebaseReady) {
        tasks = oldTasks;

        saveLocalData();

        renderTasks();
        renderMonthSummary();
        updateSummary();
    }
}

/* ================= ESCAPE HTML ================= */

function escapeHtml(text) {
    const div =
        document.createElement("div");

    div.textContent =
        String(text ?? "");

    return div.innerHTML;
}

/* ================= YEAR CHANGE ================= */

yearSelect.addEventListener(
    "change",
    function() {
        renderTasks();
        renderMonthSummary();
    }
);

/* ================= SUMMARY YEAR CHANGE ================= */

summaryYearSelect.addEventListener(
    "change",
    function() {
        renderMonthSummary();
    }
);

/* ================= MONTH CHANGE ================= */

monthSelect.addEventListener(
    "change",
    function() {
        currentFilter = "all";

        document
            .querySelectorAll(".filter")
            .forEach(
                btn =>
                    btn.classList.remove(
                        "active"
                    )
            );

        const allButton =
            document.querySelector(
                '[data-filter="all"]'
            );

        if (allButton) {
            allButton.classList.add("active");
        }

        renderTasks();
        renderMonthSummary();
    }
);

/* ================= FILTER ================= */

document
    .querySelectorAll(".filter")
    .forEach(button => {

        button.addEventListener(
            "click",
            function() {
                currentFilter =
                    this.dataset.filter;

                document
                    .querySelectorAll(".filter")
                    .forEach(
                        btn =>
                            btn.classList.remove(
                                "active"
                            )
                    );

                this.classList.add("active");

                renderTasks();
            }
        );

    });

/* ================= CLOSE MODAL ================= */

document
    .getElementById("taskModal")
    .addEventListener(
        "click",
        function(event) {
            if (event.target === this) {
                closeModal();
            }
        }
    );

/* ================= ENTER / ESC ================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape" &&
            document.getElementById(
                "taskModal"
            ).style.display === "flex"
        ) {
            closeModal();
        }

        if (
            event.key === "Enter" &&
            event.ctrlKey &&
            document.getElementById(
                "taskModal"
            ).style.display === "flex"
        ) {
            saveTask();
        }
    }
);

/* ================= DEADLINE INPUT ================= */

document
    .getElementById("taskDeadline")
    .addEventListener(
        "input",
        function(event) {

            let value =
                event.target.value
                    .replace(/[^\d]/g, "")
                    .slice(0, 12);

            if (value.length > 2) {
                value =
                    value.slice(0, 2) +
                    "/" +
                    value.slice(2);
            }

            if (value.length > 5) {
                value =
                    value.slice(0, 5) +
                    "/" +
                    value.slice(5);
            }

            if (value.length > 10) {
                value =
                    value.slice(0, 10) +
                    " " +
                    value.slice(10);
            }

            if (value.length > 13) {
                value =
                    value.slice(0, 13) +
                    ":" +
                    value.slice(13);
            }

            event.target.value =
                value.slice(0, 16);
        }
    );

/* ================= START ================= */

createConnectionStatus();
showToday();

renderTasks();
renderMonthSummary();
updateSummary();

/*
  Firebase Authentication:
  Authentication → Sign-in method → Anonymous → Enable

  Firestore Rules:
  rules_version = '2';

  service cloud.firestore {
    match /databases/{database}/documents {
      match /tasks/{userId} {
        allow read, write: if request.auth != null
                           && request.auth.uid == userId;
      }
    }
  }
*/

auth.onAuthStateChanged(function(user) {
    if (user) {
        currentUser = user;
    }
});

loadData();
</script>
