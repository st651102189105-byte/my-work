/* ================= DATA ================= */

// ใช้ข้อมูลในเครื่องเป็นข้อมูลสำรองระหว่างรอ Firebase
let tasks =
    JSON.parse(
        localStorage.getItem("myTasks")
    ) || [];

let currentFilter = "all";
let firebaseReady = false;


const thaiMonths = [

    "มกราคม",
    "กุมภาพันธ์",
    "มีนาคม",
    "เมษายน",
    "พฤษภาคม",
    "มิถุนายน",
    "กรกฎาคม",
    "สิงหาคม",
    "กันยายน",
    "ตุลาคม",
    "พฤศจิกายน",
    "ธันวาคม"

];



/* ================= YEAR ================= */

const currentYear =
    new Date().getFullYear();


const yearSelect =
    document.getElementById(
        "yearSelect"
    );


const summaryYearSelect =
    document.getElementById(
        "summaryYearSelect"
    );


/*

สร้างปีตั้งแต่
2020 ถึง 2035

สามารถใช้ได้หลายปี

*/

for (
    let year = currentYear - 5;
    year <= currentYear + 10;
    year++
) {


    const option =
        document.createElement(
            "option"
        );


    option.value =
        year;


    option.textContent =
        year;


    yearSelect.appendChild(
        option
    );


    const option2 =
        document.createElement(
            "option"
        );


    option2.value =
        year;


    option2.textContent =
        year;


    summaryYearSelect.appendChild(
        option2
    );

}


/* ตั้งปีปัจจุบัน */

yearSelect.value =
    currentYear;


summaryYearSelect.value =
    currentYear;



/* ================= TODAY ================= */

function showToday() {


    const now =
        new Date();


    const day =
        String(
            now.getDate()
        ).padStart(2,"0");


    const month =
        String(
            now.getMonth()+1
        ).padStart(2,"0");


    const year =
        now.getFullYear();


    const days = [

        "วันอาทิตย์",
        "วันจันทร์",
        "วันอังคาร",
        "วันพุธ",
        "วันพฤหัสบดี",
        "วันศุกร์",
        "วันเสาร์"

    ];


    document.getElementById(
        "todayDate"
    ).textContent =

        `${day}/${month}/${year}`;


    document.getElementById(
        "todayDay"
    ).textContent =

        days[now.getDay()];

}



/* ================= MODAL ================= */

function openModal() {

    document.getElementById(
        "taskModal"
    ).style.display =
        "flex";


    document.getElementById(
        "taskName"
    ).focus();

}


function closeModal() {

    document.getElementById(
        "taskModal"
    ).style.display =
        "none";

}



/* ================= DATE ================= */

function isValidDeadline(value) {


    const pattern =
        /^(\d{2})\/(\d{2})\/(\d{4}) (\d{2}):(\d{2})$/;


    const match =
        value.match(pattern);


    if (!match) {

        return false;

    }


    const day =
        Number(match[1]);


    const month =
        Number(match[2]);


    const year =
        Number(match[3]);


    const hour =
        Number(match[4]);


    const minute =
        Number(match[5]);


    if (
        month < 1 ||
        month > 12
    ) {

        return false;

    }


    if (
        day < 1 ||
        day > 31
    ) {

        return false;

    }


    if (
        hour < 0 ||
        hour > 23
    ) {

        return false;

    }


    if (
        minute < 0 ||
        minute > 59
    ) {

        return false;

    }


    const date =
        new Date(
            year,
            month - 1,
            day,
            hour,
            minute
        );


    return (

        date.getFullYear()
            === year &&

        date.getMonth()
            === month - 1 &&

        date.getDate()
            === day &&

        date.getHours()
            === hour &&

        date.getMinutes()
            === minute

    );

}



/* ================= PARSE DATE ================= */

function parseThaiDate(value) {


    if (!value) {

        return null;

    }


    const parts =
        value.split(" ");


    const date =
        parts[0].split("/");


    const time =
        (
            parts[1] || "00:00"
        ).split(":");


    if (
        date.length !== 3 ||
        time.length !== 2
    ) {

        return null;

    }


    return new Date(

        Number(date[2]),

        Number(date[1]) - 1,

        Number(date[0]),

        Number(time[0]),

        Number(time[1])

    );

}



/* ================= SAVE TASK ================= */

function saveTask() {


    const name =
        document.getElementById(
            "taskName"
        ).value.trim();


    const detail =
        document.getElementById(
            "taskDetail"
        ).value.trim();


    const deadline =
        document.getElementById(
            "taskDeadline"
        ).value.trim();



    if (name === "") {

        alert(
            "กรุณาใส่ชื่องาน"
        );

        return;

    }



    if (
        deadline !== "" &&
        !isValidDeadline(deadline)
    ) {

        alert(

            "รูปแบบวันที่ไม่ถูกต้อง\n\n" +

            "กรุณาใช้รูปแบบ\n" +

            "05/09/2026 17:00"

        );

        return;

    }



    const task = {

        id:
            Date.now(),

        name:
            name,

        detail:
            detail,

        deadline:
            deadline,

        status:
            "pending",

        createdAt:
            new Date().toISOString()

    };


    tasks.push(task);


    saveData();


    document.getElementById(
        "taskName"
    ).value = "";


    document.getElementById(
        "taskDetail"
    ).value = "";


    document.getElementById(
        "taskDeadline"
    ).value = "";


    closeModal();


    renderTasks();

    renderMonthSummary();

}



async function saveData() {

    // เก็บไว้ในเครื่องด้วย เผื่อเป็นข้อมูลสำรอง
    localStorage.setItem(
        "myTasks",
        JSON.stringify(tasks)
    );

    // ถ้า Firebase ยังไม่พร้อม ให้เก็บไว้ในเครื่องก่อน
    if (!firebaseReady) {
        return;
    }

    try {
        await db.collection("tasks").doc("myTasks").set({
            tasks: tasks,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        console.log("บันทึกข้อมูลลง Firebase แล้ว");

    } catch (error) {
        console.error("บันทึก Firebase ไม่สำเร็จ:", error);
        alert("บันทึกข้อมูลไม่สำเร็จ กรุณาตรวจสอบ Firebase Rules");
    }
}

/* ================= FIREBASE LOAD ================= */

async function loadData() {

    try {

        await auth.signInAnonymously();

        const doc =
            await db.collection("tasks")
                .doc("myTasks")
                .get();

        if (doc.exists) {

            const data = doc.data();

            if (Array.isArray(data.tasks)) {
                tasks = data.tasks;

                localStorage.setItem(
                    "myTasks",
                    JSON.stringify(tasks)
                );
            }

        } else {

            // ยังไม่มีข้อมูลใน Firebase
            // อัปโหลดข้อมูลจากเครื่องขึ้นไปครั้งแรก
            await db.collection("tasks")
                .doc("myTasks")
                .set({
                    tasks: tasks,
                    updatedAt:
                        firebase.firestore.FieldValue.serverTimestamp()
                });
        }

        firebaseReady = true;

        renderTasks();
        renderMonthSummary();

        console.log("โหลดข้อมูลจาก Firebase แล้ว");

    } catch (error) {

        console.error(
            "โหลด Firebase ไม่สำเร็จ:",
            error
        );

        // ถ้า Firebase ใช้งานไม่ได้ ยังใช้ localStorage ต่อได้
        firebaseReady = false;

        renderTasks();
        renderMonthSummary();
    }
}



/* ================= GET TASK DATE ================= */

function getTaskDate(task) {


    if (task.deadline) {

        return parseThaiDate(
            task.deadline
        );

    }


    return new Date(
        task.createdAt
    );

}



/* ================= RENDER TASKS ================= */

function renderTasks() {


    const selectedYear =
        Number(
            yearSelect.value
        );


    const selectedMonth =
        Number(
            document.getElementById(
                "monthSelect"
            ).value
        );


    let filteredTasks =
        tasks.filter(task => {


            const date =
                getTaskDate(task);


            if (!date) {

                return false;

            }


            return (

                date.getFullYear()
                    === selectedYear &&

                date.getMonth()
                    === selectedMonth

            );

        });



    if (
        currentFilter !== "all"
    ) {

        filteredTasks =
            filteredTasks.filter(

                task =>
                    task.status
                    === currentFilter

            );

    }



    const taskList =
        document.getElementById(
            "taskList"
        );


    const emptyState =
        document.getElementById(
            "emptyState"
        );


    taskList.innerHTML = "";



    if (
        filteredTasks.length === 0
    ) {


        taskList.style.display =
            "none";


        emptyState.style.display =
            "flex";


    }

    else {


        taskList.style.display =
            "block";


        emptyState.style.display =
            "none";



        filteredTasks.forEach(
            task => {


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "task-card";


                const icon =

                    task.status === "done"

                    ? "✅"

                    : "🟡";


                const statusText =

                    task.status === "done"

                    ? "✓ เสร็จแล้ว"

                    : "◷ ยังไม่เสร็จ";


                const statusClass =

                    task.status === "done"

                    ? "status-done"

                    : "status-pending";



                card.innerHTML = `

                    <div class="task-top">

                        <div>

                            <div class="task-name">

                                ${icon}

                                ${escapeHtml(
                                    task.name
                                )}

                            </div>


                            <div class="task-detail">

                                ${
                                    task.detail
                                    ? escapeHtml(
                                        task.detail
                                    )
                                    : "ไม่มีรายละเอียด"
                                }

                            </div>


                            <div class="task-deadline">

                                📅 กำหนดส่ง:

                                ${
                                    task.deadline
                                    || "ไม่ได้กำหนด"
                                }

                            </div>

                        </div>


                        <button

                            class="
                                status-btn
                                ${statusClass}
                            "

                            onclick="
                                toggleStatus(
                                    ${task.id}
                                )
                            ">

                            ${statusText}

                        </button>

                    </div>


                    <div class="task-actions">

                        <button

                            class="delete-btn"

                            onclick="
                                deleteTask(
                                    ${task.id}
                                )
                            ">

                            🗑 ลบงาน

                        </button>

                    </div>

                `;


                taskList.appendChild(
                    card
                );

            }

        );

    }


    updateSummary();

}



/* ================= SUMMARY ================= */

function updateSummary() {


    const selectedYear =
        Number(
            yearSelect.value
        );


    const yearTasks =
        tasks.filter(task => {


            const date =
                getTaskDate(task);


            return (

                date &&
                date.getFullYear()
                    === selectedYear

            );

        });


    const done =
        yearTasks.filter(

            task =>
                task.status === "done"

        ).length;


    const pending =
        yearTasks.filter(

            task =>
                task.status === "pending"

        ).length;



    document.getElementById(
        "totalCount"
    ).textContent =

        tasks.length;


    document.getElementById(
        "doneCount"
    ).textContent =

        done;


    document.getElementById(
        "pendingCount"
    ).textContent =

        pending;


    document.getElementById(
        "selectedYearCount"
    ).textContent =

        yearTasks.length;

}



/* ================= MONTH SUMMARY ================= */

function renderMonthSummary() {


    const year =
        Number(
            summaryYearSelect.value
        );


    const grid =
        document.getElementById(
            "monthGrid"
        );


    grid.innerHTML = "";



    const selectedMainYear =
        Number(
            yearSelect.value
        );


    const selectedMainMonth =
        Number(
            document.getElementById(
                "monthSelect"
            ).value
        );



    for (
        let month = 0;
        month < 12;
        month++
    ) {


        const monthTasks =
            tasks.filter(task => {


                const date =
                    getTaskDate(task);


                if (!date) {

                    return false;

                }


                return (

                    date.getFullYear()
                        === year &&

                    date.getMonth()
                        === month

                );

            });



        const done =
            monthTasks.filter(

                task =>
                    task.status === "done"

            ).length;


        const pending =
            monthTasks.filter(

                task =>
                    task.status === "pending"

            ).length;



        const card =
            document.createElement(
                "div"
            );


        card.className =
            "month-card";



        if (

            year === selectedMainYear &&

            month === selectedMainMonth

        ) {

            card.classList.add(
                "current"
            );

        }



        card.innerHTML = `

            <div class="month-name">

                ${thaiMonths[month]}

            </div>


            <div class="month-number">

                ${monthTasks.length}

            </div>


            <div class="month-label">

                งานทั้งหมด

            </div>


            <div class="month-status">

                <span class="month-done">

                    ✓ ${done} เสร็จ

                </span>


                <span class="month-pending">

                    ◷ ${pending} ยัง

                </span>

            </div>

        `;



        card.addEventListener(
            "click",
            function() {


                yearSelect.value =
                    year;


                document.getElementById(
                    "monthSelect"
                ).value =
                    month;


                currentFilter =
                    "all";


                document
                    .querySelectorAll(
                        ".filter"
                    )
                    .forEach(
                        btn =>
                            btn.classList.remove(
                                "active"
                            )
                    );


                document
                    .querySelector(
                        '[data-filter="all"]'
                    )
                    .classList.add(
                        "active"
                    );


                renderTasks();


                renderMonthSummary();


                window.scrollTo({

                    top: 0,

                    behavior:
                        "smooth"

                });

            }
        );


        grid.appendChild(
            card
        );

    }

}



/* ================= STATUS ================= */

function toggleStatus(id) {


    const task =
        tasks.find(
            task =>
                task.id === id
        );


    if (!task) {

        return;

    }


    task.status =

        task.status === "done"

        ? "pending"

        : "done";


    saveData();


    renderTasks();


    renderMonthSummary();

}



/* ================= DELETE ================= */

function deleteTask(id) {


    if (
        !confirm(
            "ต้องการลบงานนี้หรือไม่?"
        )
    ) {

        return;

    }


    tasks =
        tasks.filter(
            task =>
                task.id !== id
        );


    saveData();


    renderTasks();


    renderMonthSummary();

}



/* ================= ESCAPE ================= */

function escapeHtml(text) {


    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}



/* ================= YEAR CHANGE ================= */

yearSelect.addEventListener(
    "change",
    function() {


        renderTasks();

        renderMonthSummary();

    }
);



summaryYearSelect.addEventListener(
    "change",
    function() {


        renderMonthSummary();

    }
);



/* ================= MONTH CHANGE ================= */

document.getElementById(
    "monthSelect"
).addEventListener(
    "change",
    function() {


        currentFilter =
            "all";


        document
            .querySelectorAll(
                ".filter"
            )
            .forEach(
                btn =>
                    btn.classList.remove(
                        "active"
                    )
            );


        document
            .querySelector(
                '[data-filter="all"]'
            )
            .classList.add(
                "active"
            );


        renderTasks();


        renderMonthSummary();

    }
);



/* ================= FILTER ================= */

document
    .querySelectorAll(
        ".filter"
    )
    .forEach(

        button => {


            button.addEventListener(

                "click",

                function() {


                    currentFilter =
                        this.dataset.filter;


                    document
                        .querySelectorAll(
                            ".filter"
                        )
                        .forEach(
                            btn =>
                                btn.classList.remove(
                                    "active"
                                )
                        );


                    this.classList.add(
                        "active"
                    );


                    renderTasks();

                }

            );

        }

    );



/* ================= CLOSE MODAL ================= */

document
    .getElementById(
        "taskModal"
    )
    .addEventListener(

        "click",

        function(event) {


            if (
                event.target === this
            ) {

                closeModal();

            }

        }

    );



/* ================= START ================= */

showToday();

document.getElementById(
    "monthSelect"
).value =
    new Date().getMonth();

// แสดงข้อมูลเดิมก่อน แล้วค่อยโหลดข้อมูลล่าสุดจาก Firebase
renderTasks();
renderMonthSummary();

// เชื่อม Firebase และโหลดข้อมูล
loadData();

</script>
